<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Planner · Cadence</title>
<meta name="description" content="A weekly schedule grid you can edit. Changes stay in your browser.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#faf9f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121110" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23c2410c'/%3E%3Cg stroke='%23fff' stroke-width='2.2' stroke-linecap='round'%3E%3Cpath d='M9 11h14M9 16h9M9 21h12'/%3E%3C/g%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/app.css">
<script>
(function () {
  try {
    var t = localStorage.getItem("cadence.theme");
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
    var w = localStorage.getItem("cadence.width");
    document.documentElement.setAttribute("data-width", w === "focus" ? "focus" : "fluid");
  } catch (e) {
    document.documentElement.setAttribute("data-width", "fluid");
  }
})();
</script>
</head>
<body>
<div class="shell">

  <header class="topbar">
    <a class="brand" href="index.html">
      <span class="dot" aria-hidden="true"></span>
      Cadence
      <small data-i18n="ui.brand.tag"></small>
    </a>

    <span class="spacer"></span>

    <div class="seg" data-seg="theme" role="group" data-i18n-aria="ui.theme">
      <button type="button" data-value="auto"  aria-pressed="true" data-i18n="ui.auto"></button>
      <button type="button" data-value="light" aria-pressed="false" data-i18n="ui.light"></button>
      <button type="button" data-value="dark"  aria-pressed="false" data-i18n="ui.dark"></button>
    </div>

    <div class="seg" data-seg="width" role="group" data-i18n-aria="ui.width">
      <button type="button" data-value="fluid" aria-pressed="true" data-i18n="ui.fluid"></button>
      <button type="button" data-value="focus" aria-pressed="false" data-i18n="ui.focus"></button>
    </div>

    <button type="button" class="btn" data-lang-toggle data-i18n="ui.lang.switch"></button>
  </header>

  <div class="wrap">
    <div class="planner-bar">
      <a class="btn ghost" href="index.html" data-i18n="plan.back"></a>

      <div class="week-label">
        <strong id="plan-title">…</strong>
        <span id="week-range"></span>
      </div>

      <button type="button" class="btn" id="btn-prev" data-i18n="plan.prev" data-i18n-aria="plan.prev"></button>
      <button type="button" class="btn" id="btn-today" data-i18n="plan.today"></button>
      <button type="button" class="btn" id="btn-next" data-i18n="plan.next" data-i18n-aria="plan.next"></button>

      <span class="spacer"></span>

      <span class="badge" id="dirty-badge" hidden data-i18n="toast.local"></span>
      <button type="button" class="btn" id="btn-export" data-i18n="plan.export"></button>
      <label class="btn" style="cursor:pointer">
        <span data-i18n="plan.import"></span>
        <input type="file" id="file-import" accept="application/json,.json" class="sr">
      </label>
      <button type="button" class="btn" id="btn-reset" data-i18n="plan.reset"></button>
      <button type="button" class="btn primary" id="btn-add" data-i18n="plan.add"></button>
    </div>
  </div>

  <main class="wrap board">

    <div class="skeleton" id="loading" data-i18n="plan.loading"></div>

    <div id="board" hidden>
      <div class="legend" id="legend" role="group" data-i18n-aria="plan.legend"></div>

      <div class="grid-shell">
        <div class="grid-scroll">
          <div class="cal" id="cal" role="grid"></div>
        </div>
      </div>

      <div class="panels">
        <section class="panel">
          <h3 data-i18n="plan.agenda"></h3>
          <div class="agenda" id="agenda"></div>
        </section>
        <section class="panel">
          <h3 data-i18n="plan.metrics"></h3>
          <div class="meter" id="meters"></div>
        </section>
      </div>
    </div>

  </main>

  <footer class="topbar" style="position:static;border-top:1px solid var(--line);border-bottom:0">
    <span data-i18n="home.credits"></span>
    <span class="spacer"></span>
    <span class="badge" data-i18n="ui.offline"></span>
  </footer>

</div>

<dialog id="dlg">
  <form method="dialog">
    <div class="dlg-head">
      <h3 id="dlg-title" data-i18n="dlg.new"></h3>
      <button type="button" class="btn ghost" id="btn-close" data-i18n-aria="close">✕</button>
    </div>

    <div class="field">
      <label for="f-title" data-i18n="dlg.title"></label>
      <input id="f-title" type="text" data-i18n-placeholder="dlg.title.ph" required>
    </div>

    <div class="field">
      <label for="f-day" data-i18n="dlg.day"></label>
      <select id="f-day">
        <option value="mon" data-i18n="day.mon.l"></option>
        <option value="tue" data-i18n="day.tue.l"></option>
        <option value="wed" data-i18n="day.wed.l"></option>
        <option value="thu" data-i18n="day.thu.l"></option>
        <option value="fri" data-i18n="day.fri.l"></option>
        <option value="sat" data-i18n="day.sat.l"></option>
        <option value="sun" data-i18n="day.sun.l"></option>
      </select>
    </div>

    <div class="row2">
      <div class="field">
        <label for="f-start" data-i18n="dlg.start"></label>
        <input id="f-start" type="time" step="900">
      </div>
      <div class="field">
        <label for="f-end" data-i18n="dlg.end"></label>
        <input id="f-end" type="time" step="900">
      </div>
    </div>

    <div class="field">
      <label for="f-category" data-i18n="dlg.category"></label>
      <select id="f-category"></select>
    </div>

    <div class="field">
      <label for="f-note" data-i18n="dlg.note"></label>
      <textarea id="f-note" data-i18n-placeholder="dlg.note.ph"></textarea>
    </div>

    <div class="field" style="flex-direction:row;align-items:center;gap:8px">
      <input id="f-done" type="checkbox" style="width:auto">
      <label for="f-done" data-i18n="dlg.done" style="margin:0"></label>
    </div>

    <div class="dlg-foot">
      <button type="button" class="btn danger left" id="btn-delete" data-i18n="dlg.delete"></button>
      <button type="button" class="btn" id="btn-cancel" data-i18n="dlg.cancel"></button>
      <button type="submit" class="btn primary" data-i18n="dlg.save"></button>
    </div>
  </form>
</dialog>

<script src="assets/i18n.js"></script>
<script src="assets/ui.js"></script>
<script src="assets/planner.js"></script>
</body>
</html>
