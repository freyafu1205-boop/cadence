<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cadence — US B1/B2 visa process, as an OmniFlow map</title>
<meta name="description" content="An interactive OmniFlow map of the US B1/B2 short-term academic visit route for a Brazilian professor: the category decision, the 9-5-6 honorarium rule, the document set, the interview, and post-approval steps.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#fbfbfd" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0d12" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%234f46e5'/%3E%3Cg fill='none' stroke='%23fff' stroke-width='2.1' stroke-linecap='round'%3E%3Cpath d='M9 10h6M9 16h14M9 22h9'/%3E%3C/g%3E%3C/svg%3E">
<style>
:root{
  color-scheme:light dark;
  --bg:#fbfbfd; --surface:#fff; --surface-2:#f4f4f8; --line:#e6e6ec; --line-2:#d3d4de;
  --ink:#14161c; --dim:#626875; --faint:#949aa8;
  --accent:#4f46e5; --accent-2:#4338ca; --accent-soft:#eef0ff; --on-accent:#fff;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,
         "Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --pad:clamp(18px,4vw,56px);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0b0d12; --surface:#12151d; --surface-2:#171b25; --line:#232938; --line-2:#2f3749;
    --ink:#eef1f7; --dim:#98a1b3; --faint:#6c7688;
    --accent:#7c8cff; --accent-2:#9aa6ff; --accent-soft:#171a2b; --on-accent:#0b0d12;
  }
}
:root[data-theme="light"]{color-scheme:light;
  --bg:#fbfbfd; --surface:#fff; --surface-2:#f4f4f8; --line:#e6e6ec; --line-2:#d3d4de;
  --ink:#14161c; --dim:#626875; --faint:#949aa8;
  --accent:#4f46e5; --accent-2:#4338ca; --accent-soft:#eef0ff; --on-accent:#fff;}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#0b0d12; --surface:#12151d; --surface-2:#171b25; --line:#232938; --line-2:#2f3749;
  --ink:#eef1f7; --dim:#98a1b3; --faint:#6c7688;
  --accent:#7c8cff; --accent-2:#9aa6ff; --accent-soft:#171a2b; --on-accent:#0b0d12;}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
  font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
h1,h2,h3{margin:0;font-weight:620;letter-spacing:-.022em;line-height:1.18}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}

header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;
  padding:13px var(--pad);border-bottom:1px solid var(--line);
  background:color-mix(in srgb,var(--bg) 84%,transparent);backdrop-filter:blur(14px) saturate(160%)}
.mark{display:inline-flex;align-items:center;gap:9px;font-weight:650;letter-spacing:-.02em}
.mark i{width:9px;height:9px;border-radius:3px;background:var(--accent);display:inline-block}
.mark small{font-weight:500;font-size:12px;color:var(--faint);letter-spacing:0}
.grow{flex:1}
.seg{display:inline-flex;padding:2px;gap:2px;background:var(--surface-2);
  border:1px solid var(--line);border-radius:8px}
.seg button{border:0;background:transparent;color:var(--dim);padding:5px 10px;border-radius:6px;
  cursor:pointer;font-size:12.5px;font-weight:550}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.07)}
.gh{font-size:12.5px;font-weight:550;color:var(--dim);padding:6px 11px;border:1px solid var(--line-2);
  border-radius:8px;transition:border-color .15s,color .15s}
.gh:hover{color:var(--ink);border-color:var(--ink)}

main{padding:0 var(--pad)}
.hero{padding:clamp(46px,8vw,104px) 0 clamp(30px,4vw,54px)}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--accent);margin-bottom:18px}
h1{font-size:clamp(34px,6.4vw,74px);max-width:17ch;letter-spacing:-.038em}
.lede{margin-top:22px;max-width:60ch;font-size:clamp(16px,1.6vw,19px);color:var(--dim)}

.bar{display:flex;align-items:baseline;gap:14px;padding-bottom:14px;border-bottom:1px solid var(--line);
  margin-bottom:22px}
.bar h2{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:600}
.bar span{font-family:var(--mono);font-size:12px;color:var(--faint)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:18px;
  padding-bottom:clamp(40px,6vw,72px)}
.card{position:relative;display:flex;flex-direction:column;gap:13px;padding:24px 24px 20px;
  background:var(--surface);border:1px solid var(--line);border-radius:14px;
  transition:border-color .16s,transform .16s,box-shadow .16s}
.card:hover{border-color:var(--line-2);transform:translateY(-2px);
  box-shadow:0 1px 2px rgba(0,0,0,.04),0 18px 40px -22px rgba(0,0,0,.35)}
.card .no{font-family:var(--mono);font-size:12px;color:var(--accent);letter-spacing:.06em}
.card h3{font-size:20px}
.card .desc{color:var(--dim);font-size:14.5px}
.card .meta{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:auto;padding-top:16px;
  border-top:1px solid var(--line);font-family:var(--mono);font-size:11.5px;color:var(--faint)}
.card .go{position:absolute;top:22px;right:22px;color:var(--faint);transition:transform .16s,color .16s}
.card:hover .go{transform:translateX(3px);color:var(--accent)}

.note{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:26px;
  padding:30px 0 64px;border-top:1px solid var(--line)}
.note h3{font-size:13px;font-family:var(--mono);letter-spacing:.1em;text-transform:uppercase;
  color:var(--dim);font-weight:600;margin-bottom:10px}
.note p{color:var(--dim);font-size:14.5px}
.note code{font-family:var(--mono);font-size:12.5px;background:var(--surface-2);padding:1px 6px;
  border-radius:5px;border:1px solid var(--line)}

footer a.credit{color:var(--dim);text-decoration:none;border-bottom:1px solid var(--line-2);transition:color .15s,border-color .15s}
footer a.credit:hover{color:var(--ink);border-bottom-color:var(--ink)}
footer{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;padding:22px var(--pad) 34px;
  border-top:1px solid var(--line);font-size:12.5px;color:var(--faint)}
.tag{font-family:var(--mono);font-size:11.5px;padding:3px 9px;border:1px solid var(--line-2);
  border-radius:999px;color:var(--faint)}
.loading{color:var(--faint);font-family:var(--mono);font-size:13px;padding:14px 0 60px}
.err{grid-column:1/-1;padding:16px 18px;border:1px solid var(--line-2);border-radius:12px;
  color:var(--dim);font-size:14.5px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<script>
/* Apply saved preferences before the first paint — no flash. Theme "auto" writes
   nothing, so the CSS media query drives it and it keeps following the browser. */
(function(){
  try{
    var t=localStorage.getItem("cadence.site-theme");
    if(t==="light"||t==="dark") document.documentElement.setAttribute("data-theme",t);
    var l=localStorage.getItem("of-lang")||"en";
    document.documentElement.lang = l==="zh" ? "zh-CN" : "en";
  }catch(e){}
})();
</script>
</head>
<body>

<header>
  <a class="mark" href="index.html"><i></i>Cadence <small data-i18n="tag"></small></a>
  <span class="grow"></span>
  <div class="seg" data-seg="theme" role="group" aria-label="Theme">
    <button type="button" data-t="auto" aria-pressed="true" data-i18n="auto"></button>
    <button type="button" data-t="light" aria-pressed="false" data-i18n="light"></button>
    <button type="button" data-t="dark" aria-pressed="false" data-i18n="dark"></button>
  </div>
  <button type="button" class="seg" id="lang" style="padding:6px 12px"></button>
  <a class="gh" href="https://github.com/freyafu1205-boop/cadence" rel="noopener">GitHub</a>
</header>

<main>
  <section class="hero">
    <p class="eyebrow" data-i18n="eyebrow"></p>
    <h1 data-i18n="title"></h1>
    <p class="lede" data-i18n="lede"></p>
  </section>

  <div class="bar"><h2 data-i18n="maps"></h2><span id="count"></span></div>
  <div class="grid" id="grid"><p class="loading" data-i18n="loading"></p></div>

  <section class="note">
    <div>
      <h3 data-i18n="howTitle"></h3>
      <p data-i18n="howBody"></p>
    </div>
    <div>
      <h3 data-i18n="howTitle2"></h3>
      <p data-i18n="howBody2"></p>
    </div>
    <div>
      <h3 data-i18n="howTitle3"></h3>
      <p data-i18n="howBody3"></p>
    </div>
  </section>
</main>

<footer>
  <span data-i18n="foot1"></span>
  <a class="credit" href="https://github.com/kanghelyu/omni-flow" target="_blank" rel="noopener noreferrer">
    <span data-i18n="credit"></span>
  </a>
  <span class="grow"></span>
  <span class="tag" data-i18n="foot2"></span>
</footer>

<script>
const DICT = {
  en:{
    tag:"maps of plans and processes",
    auto:"Auto", light:"Light", dark:"Dark",
    eyebrow:"Interactive maps — read the shape, not the wall of text",
    title:"Every arrangement, laid out end to end.",
    lede:"Plans, timelines, procedures, schedules — each one published here as a map instead of a document. So whoever needs to look can follow any step forwards or backwards, see what depends on what, and read the note behind it. No account, no app, any device.",
    maps:"Published maps", loading:"loading the snapshot…",
    cards:"{n} available",
    nodes:"{n} nodes", edges:"{n} edges", groups:"{n} groups", notes:"{n} notes",
    open:"Open",
    howTitle:"Unmodified Studio client",
    howBody:"Each map opens the real OmniFlow Studio, shipped byte-for-byte from the project. Only the transport is replaced: a browser-side implementation of the same HTTP API reads this static snapshot instead of a local server.",
    howTitle2:"Real algorithms",
    howBody:"Layout, validation, dependency analysis and every export format come from OmniFlow's own browser-safe modules — the same files the server uses. Nothing is reimplemented for the web.",
    howTitle3:"Your edits stay yours",
    howBody:"The snapshot is read-only. Anything you drag or retype is kept in your own browser and never touches the published files, so no visitor ever sees another visitor's changes.",
    foot1:"Two static pages, no backend — anyone with the link can read them.",
    credit:"OmniFlow — engine, Studio client and page structure by kanghelyu (CC BY-NC 4.0)",
    foot2:"GitHub Pages"
  },
  zh:{
    tag:"把计划画成图",
    auto:"跟随浏览器", light:"浅色", dark:"深色",
    eyebrow:"交互式地图 —— 一眼看清，不用通读",
    title:"每一种安排，都摊开来看。",
    lede:"计划、时间线、流程、日程——都以图的形式发布在这里，而不是一大篇文档。需要看的人可以顺着任意一步往前或往后追、看清谁依赖谁，并读每一步背后的说明。不需要账号、不用装应用，任何设备都能打开。",
    maps:"已发布的图", loading:"正在载入快照…",
    cards:"共 {n} 张",
    nodes:"{n} 个节点", edges:"{n} 条边", groups:"{n} 个分组", notes:"{n} 条笔记",
    open:"打开",
    howTitle:"未修改的 Studio 客户端",
    howBody:"每张地图打开的都是真正的 OmniFlow Studio，逐字节原样发布。只有传输层被替换：由浏览器端实现同一套 HTTP API，从静态快照读取数据，而不是连本地服务器。",
    howTitle2:"真实的算法",
    howBody:"布局、校验、依赖分析与全部导出格式，都来自 OmniFlow 自己的浏览器安全模块——和服务端用的是同一批文件，没有为网页重写任何逻辑。",
    howTitle3:"你的改动只属于你",
    howBody:"快照是只读的。你拖动或改写的任何内容只保存在你自己的浏览器里，绝不会写回发布文件，所以任何访客都看不到别人的修改。",
    foot1:"两个静态页面，无后端——拿到链接的人都能看。",
    credit:"OmniFlow —— 引擎、Studio 客户端与页面结构由 kanghelyu 开发（CC BY-NC 4.0）",
    foot2:"GitHub Pages"
  }
};
const KEY="of-lang";
let lang = (()=>{ try{ return localStorage.getItem(KEY)==="zh"?"zh":"en"; }catch(e){ return "en"; } })();
const t=(k,v)=>{ let s=DICT[lang][k]??DICT.en[k]??k;
  if(v) for(const a of Object.keys(v)) s=s.replaceAll("{"+a+"}",String(v[a])); return s; };

function applyLang(){
  document.documentElement.lang = lang==="zh" ? "zh-CN" : "en";
  document.querySelectorAll("[data-i18n]").forEach(el=>{ el.textContent=t(el.getAttribute("data-i18n")); });
  const btn=document.getElementById("lang");
  btn.textContent = lang==="en" ? "中文" : "English";
  btn.setAttribute("aria-label", lang==="en" ? "Switch to Chinese" : "切换到英文");
}
function setLang(next){
  lang=next;
  /* The Studio reads the same key, so a map opened from here matches. */
  try{ localStorage.setItem(KEY,next); }catch(e){}
  applyLang();
  if(index) render(index);
}

/* theme: the explicit choice is mirrored into of-theme so maps match;
   "auto" removes it, which is what makes the Studio follow the browser too. */
const TK="cadence.site-theme";
function applyTheme(v){
  if(v==="light"||v==="dark"){
    document.documentElement.setAttribute("data-theme",v);
    try{ localStorage.setItem(TK,v); localStorage.setItem("of-theme",v); }catch(e){}
  }else{
    document.documentElement.removeAttribute("data-theme");
    try{ localStorage.removeItem(TK); localStorage.removeItem("of-theme"); }catch(e){}
  }
  document.querySelectorAll('[data-seg="theme"] button').forEach(b=>
    b.setAttribute("aria-pressed", String(b.dataset.t===v)));
}

let index=null;

function card(m,i){
  const a=document.createElement("a");
  a.className="card"; a.href="map.html#"+encodeURIComponent(m.id);
  const no=document.createElement("span"); no.className="no";
  no.textContent=String(i+1).padStart(2,"0")+" /";
  const h=document.createElement("h3"); h.textContent=m.name;
  const d=document.createElement("p"); d.className="desc"; d.textContent=m.description;
  const meta=document.createElement("div"); meta.className="meta";
  for(const piece of [
    t("nodes",{n:m.nodes}), t("edges",{n:m.edges}),
    t("groups",{n:m.groups}), t("notes",{n:m.notes}),
  ]){ const s=document.createElement("span"); s.textContent=piece; meta.appendChild(s); }
  const go=document.createElement("span"); go.className="go"; go.setAttribute("aria-hidden","true");
  go.textContent="→";
  a.append(no,h,d,meta,go);
  return a;
}

function render(data){
  const grid=document.getElementById("grid");
  document.getElementById("count").textContent=t("cards",{n:data.graphs.length});
  grid.innerHTML="";
  data.graphs.forEach((m,i)=>grid.appendChild(card(m,i)));
}

async function boot(){
  applyLang();
  applyTheme((()=>{ try{ const v=localStorage.getItem(TK); return v==="light"||v==="dark"?v:"auto"; }catch(e){ return "auto"; } })());
  try{
    const res=await fetch("data/index.json",{cache:"no-store"});
    if(!res.ok) throw new Error("HTTP "+res.status);
    index=await res.json();
    render(index);
  }catch(e){
    const grid=document.getElementById("grid"); grid.innerHTML="";
    const box=document.createElement("div"); box.className="err";
    box.textContent="data/index.json could not be loaded ("+e.message+"). Serve this folder over HTTP — a file:// page cannot fetch JSON.";
    grid.appendChild(box);
  }
}

document.querySelector('[data-seg="theme"]').addEventListener("click",e=>{
  const b=e.target.closest("button[data-t]"); if(b) applyTheme(b.dataset.t);
});
document.getElementById("lang").addEventListener("click",()=>setLang(lang==="en"?"zh":"en"));
boot();
</script>
</body>
</html>
